name: nightly
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        # MinIO floor (README "MinIO floor version") and the rolling `latest`.
        # MinIO no longer publishes pullable images, so the floor is compiled
        # from source and `latest` is the pgsty/minio community fork. See
        # .forgejo/workflows/nightly.yml for the full rationale.
        include:
          - leg: floor
            minio: "harbormaster-minio-floor:local"
            build_floor: true
          - leg: latest
            minio: "pgsty/minio:latest"
            build_floor: false
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: apps/backend/go.mod }
      - name: Build floor MinIO image
        if: ${{ matrix.build_floor }}
        run: |
          docker build -t "${{ matrix.minio }}" \
            -f apps/backend/internal/integration/minio-floor.Dockerfile \
            apps/backend/internal/integration
      - name: Run integration suite
        env:
          HARBORMASTER_INTEGRATION: "1"
          HARBORMASTER_MINIO_IMAGE: ${{ matrix.minio }}
        run: |
          cd apps/backend
          go test -race -count=1 -tags=integration ./...
