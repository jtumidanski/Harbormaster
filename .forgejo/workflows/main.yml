name: main
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    # Loop prevention for bump-manifest below: its squash-merge commit touches
    # only this file, which would otherwise start another build that bumps
    # again, forever.
    # (Path filters do not apply to tag pushes, which is fine — bump-manifest
    # only runs on refs/heads/main.)
    paths-ignore:
      - "deploy/kubernetes/deployment.yaml"
  # Lets the image pipeline be exercised on a branch — used to prove the Trivy
  # gate bites before anything is pushed, and useful for any later rebuild.
  workflow_dispatch: {}

permissions:
  contents: read

env:
  IMAGE: registry.tumidanski/jtumidanski/harbormaster

# Every job below clears /work/ci-cache as its first step after checkout. Two
# rules, both load-bearing on the host executor, and identical to pr.yml's:
#
#   1. Cache paths are fixed absolute paths under /work/ci-cache, never
#      ${{ github.workspace }}/...: the host executor gives every job a unique
#      workspace directory, and the cache entry's version is derived from the
#      cached paths, so a workspace-relative cache can never be restored from
#      the Forgejo cache server. See the k3s repo's README, "Forgejo CI". Set
#      at job level, never workflow level -- at workflow level
#      ${{ github.workspace }} expands to the empty string.
#
#   2. Host-mode runners share /work (a per-pod emptyDir) between jobs, so
#      state left behind by a previous job would silently warm this one. Clear
#      it first so the directory stays bounded to a single build's worth of
#      data. A fixed path is safe because runner capacity is 1, so no two jobs
#      share /work concurrently.
#
# Unlike pr.yml there are no actions/cache steps here and no setup-go /
# setup-node: the Go and Node toolchains only ever run inside BuildKit, whose
# layer cache lives in zot (the buildcache-* tags below), not on the cache
# server. The only thing this workflow puts under /work/ci-cache is Trivy's
# vulnerability database. That one IS cached, but not by anything declared here:
# aquasecurity/trivy-action calls actions/cache itself, keyed cache-trivy-<date>
# (~81 MB). The reset above costs nothing whenever that day's entry already
# exists: the DB comes back from the cache server on a hit, and the action
# skips the save ("Cache hit occurred on the primary key ..., not saving
# cache").
#
# But the key is per-DATE, so that only holds if something already created
# today's entry -- normally pr.yml's dependency-scan, which runs on every PR.
# A direct push to main on a day with no PR (a bump-triggered rebuild, a
# hotfix, a weekend) misses, and this workflow then saves the ~81 MB entry
# itself. So: usually no blob of its own, not never. Sized accordingly when
# reasoning about the cache PVC.

jobs:
  # amd64 builds on bee's in-cluster buildkitd. The vulnerability gate runs here,
  # on a docker-archive tarball, BEFORE anything is pushed: trivy --input reads
  # docker-save tars (manifest.json) and OCI layout dirs, but not the multi-arch
  # OCI archive that type=oci emits. Findings are arch-independent here
  # (distroless base + static CGO_ENABLED=0 Go binary).
  build-amd64:
    runs-on: ubuntu-24.04
    outputs:
      short: ${{ steps.vars.outputs.short }}
      version: ${{ steps.vars.outputs.version }}
      labels: ${{ steps.meta.outputs.labels }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Reset toolchain caches
        run: rm -rf /work/ci-cache
      # `short` names the per-arch tags and the manifest pin; `version` is what
      # gets baked into the binary (-X main.version) and the image's
      # org.opencontainers.image.version label. They differ on a tag push: a
      # v1.2.3 push must ship a binary that reports 1.2.3, matching the
      # :1.2.3 tag metadata-action publishes in the manifest job. The GitHub
      # original got this from steps.meta.outputs.version; deriving it from
      # GITHUB_REF keeps sha-<short> (not the branch name) on branch pushes.
      # Both legs read these outputs -- build-arm64 must never recompute them.
      - id: vars
        run: |
          set -euo pipefail
          short="sha-${GITHUB_SHA::7}"
          case "$GITHUB_REF" in
            refs/tags/v*) version="${GITHUB_REF#refs/tags/v}" ;;
            *)            version="$short" ;;
          esac
          echo "short=$short"     >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "short=$short version=$version"
      # Only `labels` is consumed from this step -- the authoritative tag list
      # lives in the manifest job, which is what actually publishes tags. The
      # labels are what the GitHub original passed to both of its build steps
      # and what this port dropped: org.opencontainers.image.revision and
      # .created exist nowhere else (the Dockerfile's own LABEL block covers
      # title/description/source/licenses/version only), and imagetools create
      # adds no annotations of its own. The tag list here is deliberately
      # minimal because no auto-generated label depends on it once
      # .image.version is pinned below; .source and .url resolve to the forge
      # rather than the Dockerfile's hard-coded github.com URLs, which is
      # correct now. build-arm64 reuses this output so both per-arch configs
      # carry byte-identical labels, including .created.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: type=sha,prefix=sha-,format=short
          # These three are pinned because metadata-action's auto-generated
          # values override the Dockerfile's own LABEL block, and two of them
          # are wrong or absent here. .licenses comes from the forge repo's
          # licence field, which the mirrored repository does not report, so it
          # arrives EMPTY and silently erases AGPL-3.0-or-later. .description
          # comes from the mutable repo description, so the image would drift
          # whenever that text is edited. .version must equal the VERSION
          # build-arg, or the label disagrees with the binary's own -X
          # main.version on a tag push -- the defect this step exists to fix.
          labels: |
            org.opencontainers.image.version=${{ steps.vars.outputs.version }}
            org.opencontainers.image.licenses=AGPL-3.0-or-later
            org.opencontainers.image.description=Self-hosted admin UI for S3 object stores (MinIO, RustFS)
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: remote
          endpoint: tcp://buildkitd.buildkit.svc.cluster.local:1234
          driver-opts: |
            cacert=/etc/buildkit-client/ca.pem
            cert=/etc/buildkit-client/cert.pem
            key=/etc/buildkit-client/key.pem
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.tumidanski
          username: ci
          password: ${{ secrets.ZOT_CI_PASSWORD }}
      - name: Build image for scanning (single-arch, no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: false
          load: false
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.vars.outputs.short }}-amd64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.vars.outputs.version }}
          outputs: type=docker,dest=/tmp/image.tar
      # aquasecurity/setup-trivy is skipped (skip-setup-trivy below): it installs
      # Trivy by checking out aquasecurity/trivy from github.com with
      # actions/checkout, which passes the forge's job token as a github.com
      # credential and dies. The runner image bakes the trivy binary instead
      # (k3s ci/forgejo-runner-image/Dockerfile, TRIVY_VERSION); the action
      # picks it up from PATH. Do NOT install trivy from here: the runners are
      # host-mode with a shared /usr/local/bin, so a per-job install
      # overwrites the baked binary for every other repo's jobs (it did,
      # 2026-09-21..22, downgrading 0.74.0 to 0.70.0 fleet-wide).
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          input: /tmp/image.tar
          ignore-unfixed: "true"
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          trivyignores: ".trivyignore"
          skip-setup-trivy: "true"
          # The action's default is ${{ github.workspace }}/.cache/trivy, which
          # can never be restored here; see the header comment.
          cache-dir: /work/ci-cache/trivy
      - name: Push amd64
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/amd64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ steps.vars.outputs.short }}-amd64
          labels: ${{ steps.meta.outputs.labels }}
          build-args: VERSION=${{ steps.vars.outputs.version }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-amd64
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-amd64,mode=max

  # arm64 builds natively on one of the Pi 4 workers. No QEMU: the Pis exist to
  # replace emulation.
  #
  # `needs: build-amd64` is what makes the Trivy gate above absolute. The two
  # legs are otherwise independent and would run in parallel, which would let
  # this job publish <tag>-arm64 while the gate was still deciding -- a failing
  # scan would then leave a scanned-and-rejected build half-pushed to zot.
  # Serializing costs roughly the amd64 leg's wall time (~8 min) per push and
  # buys "a failed scan pushes nothing, anywhere".
  #
  # The tag comes from build-amd64's output rather than being recomputed, so
  # the four jobs cannot disagree about it.
  build-arm64:
    needs: [build-amd64]
    runs-on: ubuntu-24.04
    env:
      SHORT: ${{ needs.build-amd64.outputs.short }}
      VERSION: ${{ needs.build-amd64.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - name: Reset toolchain caches
        run: rm -rf /work/ci-cache
      - id: arm64
        uses: https://git.tumidanski/ci/actions/select-arm64-builder@v1
      - name: Selected arm64 builder
        run: echo "arm64 builder host=${{ steps.arm64.outputs.host }} endpoint=${{ steps.arm64.outputs.endpoint }} preferred=${{ steps.arm64.outputs.preferred }}"
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: remote
          endpoint: ${{ steps.arm64.outputs.endpoint }}
          driver-opts: |
            cacert=/etc/buildkit-client/ca.pem
            cert=/etc/buildkit-client/cert.pem
            key=/etc/buildkit-client/key.pem
            servername=${{ steps.arm64.outputs.host }}.tumidanski
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.tumidanski
          username: ci
          password: ${{ secrets.ZOT_CI_PASSWORD }}
      - name: Push arm64 (on ${{ steps.arm64.outputs.host }})
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: deploy/docker/Dockerfile
          platforms: linux/arm64
          push: true
          provenance: false
          tags: ${{ env.IMAGE }}:${{ env.SHORT }}-arm64
          labels: ${{ needs.build-amd64.outputs.labels }}
          build-args: VERSION=${{ env.VERSION }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache-arm64
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache-arm64,mode=max
      - name: Assert the published layer really is arm64
        run: |
          set -euo pipefail
          arch=$(docker buildx imagetools inspect "${IMAGE}:${SHORT}-arm64" \
            --format '{{json .Image}}' | jq -r .architecture)
          echo "built on ${{ steps.arm64.outputs.host }}, architecture=$arch"
          test "$arch" = arm64

  # Merges the two single-platform tags into every tag metadata-action would
  # have produced. imagetools needs a builder and runner pods have no Docker
  # daemon, hence the remote driver here too.
  manifest:
    needs: [build-amd64, build-arm64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reset toolchain caches
        run: rm -rf /work/ci-cache
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: remote
          endpoint: tcp://buildkitd.buildkit.svc.cluster.local:1234
          driver-opts: |
            cacert=/etc/buildkit-client/ca.pem
            cert=/etc/buildkit-client/cert.pem
            key=/etc/buildkit-client/key.pem
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.tumidanski
          username: ci
          password: ${{ secrets.ZOT_CI_PASSWORD }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          # A deliberate divergence from the frozen GitHub original, which left
          # this at the default `latest=auto`. Under `auto`, metadata-action
          # adds `latest` for ANY semver tag push, regardless of the explicit
          # type=raw line below -- so pushing v1.2.3 silently repointed
          # :latest, and the enable= condition that looks like the only control
          # over :latest was not. Proven on this repository: the throwaway
          # v9.9.9 push moved :latest off main's build. Nothing deploys from
          # :latest today (deployment.yaml pins sha-<short>), but Argo points at
          # this registry from Task 6 on, and "the canonical-looking tag is
          # whatever was pushed last" is not a property to carry into the other
          # repositories. With latest=false the type=raw line below is the whole
          # truth: :latest moves on a push to main and at no other time.
          flavor: latest=false
          # The branch tag is guarded too: without `enable` every
          # workflow_dispatch on a branch would leave that branch's name in zot
          # forever, and zot has no TTL. main is the only branch whose tag is
          # meaningful.
          tags: |
            type=ref,event=branch,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Create multi-arch manifests
        env:
          SHORT: ${{ needs.build-amd64.outputs.short }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -euo pipefail
          echo "$TAGS" | while read -r tag; do
            [ -n "$tag" ] || continue
            echo "== $tag"
            docker buildx imagetools create -t "$tag" \
              "${IMAGE}:${SHORT}-amd64" "${IMAGE}:${SHORT}-arm64"
          done
          docker buildx imagetools inspect "${IMAGE}:${SHORT}" --format '{{json .Manifest}}' | jq .
          archs=$(docker buildx imagetools inspect "${IMAGE}:${SHORT}" --format '{{json .Manifest}}' \
            | jq -r '[.manifests[].platform.architecture] | sort | unique | join(",")')
          echo "architectures=$archs"
          test "$archs" = "amd64,arm64"

  # Rewrites the image tag in deploy/kubernetes/deployment.yaml to the commit
  # that produced the image, and lands it on main through a bot PR. Argo CD on
  # the bee cluster watches that directory, so this is the deploy step.
  #
  # main is protected (required checks, admins enforced), and Forgejo applies
  # required checks to pushes as well as to merges, so a direct push to main is
  # rejected. The job therefore pushes the branch bot/image-bump-<7-char sha>,
  # opens a PR from it, and schedules auto-merge; `pr / pr-complete` gates the
  # merge like any other PR. Every API call and the branch push use
  # FORGE_PUSH_TOKEN, not the run token: a PR opened with the run token
  # triggers no pull_request workflow, so pr-complete would never report and
  # the PR would never merge. Loop prevention is still the paths-ignore filter
  # above: the squash-merge commit touches only deployment.yaml.
  # Operator runbook (stuck or superseded bump PRs): docs/operator/image-bump.md.
  #
  # The tag must match what metadata-action publishes above --
  # `type=sha,prefix=sha-,format=short` yields `sha-` plus the SHORT sha
  # (7 chars), e.g. sha-f17d771. Using the full 40-character ${GITHUB_SHA}
  # would pin to a tag that is never pushed and every pod would land in
  # ImagePullBackOff.
  bump-manifest:
    needs: [manifest]
    # A tag is not a branch — there would be nothing to commit back to.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    # Serialize across overlapping runs so a later run's bump cannot be undone
    # by an earlier one finishing after it. Never cancel a queued bump:
    # cancelling mid-push risks a half-written commit.
    concurrency:
      group: bump-manifest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # MUST be `ref: main`. The default checkout for a push event leaves a
        # detached HEAD, and `git push` from one fails outright.
        # Full (blobless) history is for the stale guard's ancestry and diff
        # checks. The persisted credentials are FORGE_PUSH_TOKEN's, so the
        # branch push in the `pr` step authenticates as the bot.
        with:
          ref: main
          fetch-depth: 0
          filter: blob:none
          token: ${{ secrets.FORGE_PUSH_TOKEN }}
      - name: Reset toolchain caches
        run: rm -rf /work/ci-cache
      - name: Pin image to this commit
        id: pin
        run: |
          set -euo pipefail

          # Stale-run guard: skip if main has newer *code* than this run's
          # commit — GITHUB_SHA is not on main, or a path other than
          # deployment.yaml changed between it and the tip. Bump-only movement
          # (another bump PR merging) does not count, so pinning cannot roll the
          # deployment backwards. Exit 2 from the guard fails this step.
          stale="$(tools/ci/stale-guard.sh)"
          if [ "$stale" = "stale=true" ]; then
            echo "main has newer code than this run's ${GITHUB_SHA} — a newer run will pin itself. Skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The rewrite applies to main's tip, which may already carry another bump.
          short="sha-${GITHUB_SHA::7}"
          f=deploy/kubernetes/deployment.yaml
          sed -i -E "s#(image: registry\.tumidanski/jtumidanski/harbormaster):.*#\1:${short}#" "$f"

          if git diff --quiet "$f"; then
            echo "already pinned to ${short} — nothing to bump"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Fail loudly rather than opening a PR for a manifest the rewrite missed.
          grep -q "image: registry.tumidanski/jtumidanski/harbormaster:${short}$" "$f"
          echo "skip=false" >> "$GITHUB_OUTPUT"
      - name: Supersede older bump PRs
        id: supersede
        if: steps.pin.outputs.skip != 'true'
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_PUSH_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          set -euo pipefail

          # api METHOD PATH EXPECTED_CODES [JSON] — EXPECTED_CODES is comma-separated.
          # Sets API_CODE; body in "$resp". Unexpected code: print ≤300 bytes, exit 1.
          api() {
            local m="$1" p="$2" ok="$3" data="${4:-}"
            local args=(-sS -o "$resp" -w '%{http_code}' -X "$m"
                        -H "Authorization: token ${FORGE_TOKEN}" -H 'Content-Type: application/json')
            [ -n "$data" ] && args+=(--data "$data")
            API_CODE="$(curl "${args[@]}" "${API}${p}")"
            echo "$m $p → HTTP $API_CODE"
            case ",$ok," in *",$API_CODE,"*) return 0 ;; esac
            echo "::error::$m $p returned HTTP $API_CODE"; head -c 300 "$resp"; echo; exit 1
          }

          BRANCH="bot/image-bump-${GITHUB_SHA::7}"
          resp="$(mktemp)"

          # Older bump PRs pin something older (the stale guard has shown this
          # run's commit is the newest built one); close them before our own
          # branch exists, so two PRs never race to rewrite the same line.
          # Collect every page first: closing while paging would shift pages.
          matches=""
          page=1
          while :; do
            api GET "/pulls?state=open&limit=50&page=$page" 200
            matches+="$(jq -r --arg me "$BRANCH" '.[] | select((.head.ref | startswith("bot/image-bump-")) and .head.repo.full_name == .base.repo.full_name and .head.ref != $me) | "\(.number) \(.head.ref)"' "$resp")"$'\n'
            [ "$(jq 'length' "$resp")" -lt 50 ] && break
            page=$((page + 1))
          done

          superseded=0
          while read -r num ref; do
            [ -n "$num" ] || continue
            api PATCH "/pulls/$num" 200,201 '{"state":"closed"}'
            api DELETE "/branches/${ref//\//%2F}" 204,404
            echo "superseded #$num ($ref)"
            superseded=$((superseded + 1))
          done <<< "$matches"
          [ "$superseded" -gt 0 ] || echo "no older bump PRs"
      - name: Push branch and open PR
        id: pr
        if: steps.pin.outputs.skip != 'true'
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_PUSH_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
        run: |
          set -euo pipefail

          # api METHOD PATH EXPECTED_CODES [JSON] — EXPECTED_CODES is comma-separated.
          # Sets API_CODE; body in "$resp". Unexpected code: print ≤300 bytes, exit 1.
          api() {
            local m="$1" p="$2" ok="$3" data="${4:-}"
            local args=(-sS -o "$resp" -w '%{http_code}' -X "$m"
                        -H "Authorization: token ${FORGE_TOKEN}" -H 'Content-Type: application/json')
            [ -n "$data" ] && args+=(--data "$data")
            API_CODE="$(curl "${args[@]}" "${API}${p}")"
            echo "$m $p → HTTP $API_CODE"
            case ",$ok," in *",$API_CODE,"*) return 0 ;; esac
            echo "::error::$m $p returned HTTP $API_CODE"; head -c 300 "$resp"; echo; exit 1
          }

          BRANCH="bot/image-bump-${GITHUB_SHA::7}"
          ENC_BRANCH="${BRANCH//\//%2F}"
          resp="$(mktemp)"
          short="sha-${GITHUB_SHA::7}"

          # 1. A PR for this branch already exists (a re-run): reuse it if open;
          #    a merged PR is done, and one closed by hand is not reopened.
          api GET "/pulls/main/$ENC_BRANCH" 200,404
          if [ "$API_CODE" = 200 ]; then
            num="$(jq -r .number "$resp")"
            state="$(jq -r 'if .merged then "merged" else .state end' "$resp")"
            if [ "$state" = "open" ]; then
              echo "PR #$num is open, reusing it"
              echo "number=$num" >> "$GITHUB_OUTPUT"
            else
              echo "PR #$num is $state"
            fi
            exit 0
          fi

          # 2. Push the branch unless an earlier attempt already did. Never
          #    force-push: the branch may have been fixed up by hand.
          rc=0
          git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null || rc=$?
          case "$rc" in
            0)
              echo "branch exists, reusing (no push)"
              ;;
            2)
              git switch -c "$BRANCH"
              git config user.name  "harbormaster-image-bot"
              git config user.email "harbormaster-image-bot@git.tumidanski"
              git add deploy/kubernetes/deployment.yaml
              git commit -m "chore(deploy): pin harbormaster image to ${short}

          Generated by main.yml run ${GITHUB_RUN_ID}. Argo CD's
          Application(harbormaster-main) on the bee cluster picks this up on its
          next reconcile."
              # Authenticates through the credentials checkout persisted
              # (FORGE_PUSH_TOKEN); the token is never put in a URL.
              git push origin "$BRANCH"
              ;;
            *)
              echo "::error::git ls-remote for $BRANCH failed (exit $rc)"
              exit 1
              ;;
          esac

          # 3. Open the PR.
          body="Pins deploy/kubernetes/deployment.yaml to \`${short}\`, the image built from ${GITHUB_SHA}.

          Generated by main.yml run ${GITHUB_RUN_ID}. Argo CD's Application \`harbormaster-main\` on the bee cluster picks this up on its next reconcile once merged.

          This PR auto-merges once \`pr / pr-complete\` passes."
          payload="$(jq -n \
            --arg head "$BRANCH" \
            --arg title "chore(deploy): pin harbormaster image to ${short}" \
            --arg body "$body" \
            '{head: $head, base: "main", title: $title, body: $body}')"
          api POST /pulls 201 "$payload"
          num="$(jq -r .number "$resp")"
          echo "opened PR #$num"
          echo "number=$num" >> "$GITHUB_OUTPUT"
      - name: Enable auto-merge
        id: automerge
        if: steps.pr.outputs.number != ''
        env:
          FORGE_TOKEN: ${{ secrets.FORGE_PUSH_TOKEN }}
          API: ${{ github.server_url }}/api/v1/repos/${{ github.repository }}
          N: ${{ steps.pr.outputs.number }}
        run: |
          set -euo pipefail

          # The merge endpoint can briefly refuse a PR that was just opened, so
          # retry. 409 means auto-merge is already scheduled (a re-run).
          resp="$(mktemp)"
          payload='{"Do":"squash","merge_when_checks_succeed":true,"delete_branch_after_merge":true}'
          for i in $(seq 1 12); do
            code="$(curl -sS -o "$resp" -w '%{http_code}' -X POST \
              -H "Authorization: token ${FORGE_TOKEN}" -H 'Content-Type: application/json' \
              --data "$payload" "${API}/pulls/${N}/merge")"
            case "$code" in
              2??|409)
                echo "auto-merge scheduled (HTTP $code)"
                exit 0
                ;;
            esac
            echo "attempt $i/12: HTTP $code"
            head -c 300 "$resp"; echo
            [ "$i" -lt 12 ] && sleep 10
          done
          echo "::error::could not schedule auto-merge for PR #${N}"
          exit 1
