name: nightly
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        # MinIO floor (per docs/operator/security.md "supported floor") and the
        # rolling `latest` tag.
        minio:
          - "quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z"
          - "quay.io/minio/minio:latest"
    runs-on: ubuntu-24.04
    # Fixed absolute paths, set at job level, cleared as the first step below.
    # See the header comment in pr.yml for why both halves are load-bearing on
    # the host executor.
    env:
      GOMODCACHE: /work/ci-cache/go/mod
      GOCACHE: /work/ci-cache/go/build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reset toolchain caches
        run: rm -rf /work/ci-cache
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: apps/backend/go.mod, cache-dependency-path: apps/backend/go.sum }
      - name: Run integration suite
        env:
          HARBORMASTER_INTEGRATION: "1"
          HARBORMASTER_MINIO_IMAGE: ${{ matrix.minio }}
        run: |
          cd apps/backend
          go test -race -count=1 -tags=integration ./...
