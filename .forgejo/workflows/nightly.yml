name: nightly
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        # MinIO floor (README "MinIO floor version") and the rolling `latest`.
        #
        # The runners have no Docker daemon, so the suite runs each test's
        # MinIO as a local process from HARBORMASTER_MINIO_BINARY instead of
        # a testcontainer (see internal/integration/helper.go). MinIO no
        # longer publishes images or binaries, so:
        #   - floor: upstream RELEASE.2025-09-07T16-13-09Z, compiled from
        #     source with `go install` (module proxy + sumdb verified).
        #   - latest: the newest release of pgsty/silo (formerly
        #     pgsty/minio), the community fork that still cuts releases,
        #     checked against its published sha256 checksums.
        # A MinIO that fails to start fails the suite; it no longer skips.
        leg: [floor, latest]
    runs-on: ubuntu-24.04
    # Fixed absolute paths, set at job level, cleared as the first step below,
    # and restored by an explicit actions/cache step rather than setup-go's own
    # `cache:` input. See the header comment in pr.yml for why all three are
    # load-bearing on the host executor.
    env:
      GOMODCACHE: /work/ci-cache/go/mod
      GOCACHE: /work/ci-cache/go/build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reset toolchain caches
        run: rm -rf /work/ci-cache
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with: { go-version-file: apps/backend/go.mod, cache: false }
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            /work/ci-cache/go/mod
            /work/ci-cache/go/build
          key: go-ubuntu-24.04-x64-${{ steps.go.outputs.go-version }}-${{ hashFiles('apps/backend/go.sum') }}
      - name: Provide MinIO binary (${{ matrix.leg }})
        env:
          LEG: ${{ matrix.leg }}
        run: tools/nightly-minio-binary.sh "$LEG"
      - name: Run integration suite
        env:
          HARBORMASTER_INTEGRATION: "1"
        run: |
          cd apps/backend
          go test -race -count=1 -tags=integration ./...
