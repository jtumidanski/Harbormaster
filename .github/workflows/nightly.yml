name: nightly
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        # MinIO floor (README "MinIO floor version") and the rolling `latest`.
        # MinIO runs as a local process from HARBORMASTER_MINIO_BINARY: the
        # floor compiled from upstream source, `latest` the pgsty/silo
        # community fork's newest release. See .forgejo/workflows/nightly.yml
        # for the full rationale.
        leg: [floor, latest]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version-file: apps/backend/go.mod }
      - name: Provide MinIO binary (${{ matrix.leg }})
        env:
          LEG: ${{ matrix.leg }}
        run: tools/nightly-minio-binary.sh "$LEG"
      - name: Run integration suite
        env:
          HARBORMASTER_INTEGRATION: "1"
        run: |
          cd apps/backend
          go test -race -count=1 -tags=integration ./...
