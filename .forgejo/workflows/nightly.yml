name: nightly
on:
  schedule:
    - cron: "0 3 * * *" # 03:00 UTC daily
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  integration:
    strategy:
      fail-fast: false
      matrix:
        # MinIO floor (README "MinIO floor version") and the rolling `latest`.
        #
        # MinIO no longer publishes pullable images (quay.io/minio/minio and
        # docker.io/minio/minio both 401 anonymous pulls), so:
        #   - floor: upstream RELEASE.2025-09-07T16-13-09Z, compiled from
        #     source by the "Build floor MinIO image" step below.
        #   - latest: pgsty/minio, the community fork that still cuts
        #     releases of the same codebase.
        # A missing image does not fail the suite -- setup() t.Skipf's every
        # test when the container cannot start -- so check the log for SKIP.
        include:
          - leg: floor
            minio: "harbormaster-minio-floor:local"
            build_floor: true
          - leg: latest
            minio: "pgsty/minio:latest"
            build_floor: false
    runs-on: ubuntu-24.04
    # Fixed absolute paths, set at job level, cleared as the first step below,
    # and restored by an explicit actions/cache step rather than setup-go's own
    # `cache:` input. See the header comment in pr.yml for why all three are
    # load-bearing on the host executor.
    env:
      GOMODCACHE: /work/ci-cache/go/mod
      GOCACHE: /work/ci-cache/go/build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Reset toolchain caches
        run: rm -rf /work/ci-cache
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        id: go
        with: { go-version-file: apps/backend/go.mod, cache: false }
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            /work/ci-cache/go/mod
            /work/ci-cache/go/build
          key: go-ubuntu-24.04-x64-${{ steps.go.outputs.go-version }}-${{ hashFiles('apps/backend/go.sum') }}
      - name: Build floor MinIO image
        if: ${{ matrix.build_floor }}
        run: |
          docker build -t "${{ matrix.minio }}" \
            -f apps/backend/internal/integration/minio-floor.Dockerfile \
            apps/backend/internal/integration
      - name: Run integration suite
        env:
          HARBORMASTER_INTEGRATION: "1"
          HARBORMASTER_MINIO_IMAGE: ${{ matrix.minio }}
        run: |
          cd apps/backend
          go test -race -count=1 -tags=integration ./...
